<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Light the fire. Shape the shadow. Borrow six seconds." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Six Seconds of Sun</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #05080f;
        overflow: hidden;
      }
      #game {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #game canvas {
        display: block;
      }
      #boot-error {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 12px;
        color: #f5f2e9;
        font: 16px 'Segoe UI', system-ui, sans-serif;
        text-align: center;
        padding: 16px;
      }
      #boot-error button {
        font: inherit;
        padding: 8px 18px;
        border-radius: 6px;
        border: 1px solid #ffc857;
        background: #17233b;
        color: #f5f2e9;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="boot-error">
      <div>The observatory failed to start.</div>
      <button type="button" onclick="location.reload()">Retry</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
